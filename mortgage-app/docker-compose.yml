services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mortgage
      MYSQL_USER: mortgage
      MYSQL_PASSWORD: mortgage_local_only
      MYSQL_ROOT_PASSWORD: local_root_only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -umortgage -pmortgage_local_only --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mortgage-backend:
    build:
      context: ./backend
    environment:
      PORT: 3001
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DATABASE: mortgage
      MYSQL_USER: mortgage
      MYSQL_PASSWORD: mortgage_local_only
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mortgage-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
