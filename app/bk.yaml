apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-backend
  namespace: prod
  labels:
    app: mortgage-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mortgage-backend
  template:
    metadata:
      labels:
        app: mortgage-backend
    spec:
      containers:
      - name: backend
        image: techwmarcus/mtg-backend:v0.5
        imagePullPolicy: IfNotPresent
        ports:                # FIXED: Properly nested inside container properties
        - name: http
          containerPort: 3001
        env:                  # FIXED: Properly nested inside container properties
        - name: PORT
          value: "3001"
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef:
              name: mortgage-db
              key: db_host     # FIXED: Must be the secret key data identifier, not the raw endpoint string
        - name: MYSQL_PORT
          valueFrom:
            secretKeyRef:
              name: mortgage-db
              key: db_port     # FIXED: Must be the secret key data identifier
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mortgage-db
              key: db_name
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mortgage-db
              key: db_user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mortgage-db
              key: db_password
        - name: VITE_AWS_REGION
          valueFrom:
            secretKeyRef:
              name: creds-db
              key: VITE_AWS_REGION
        - name: VITE_COGNITO_USER_POOL
          valueFrom:
            secretKeyRef:
              name: creds-db
              key: VITE_COGNITO_USER_POOL
            key: VITE_COGNITO_USER_POOL_ID
        - name: VITE_COGNITO_USER_POOL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: creds-db
              key: VITE_COGNITO_USER_POOL_CLIENT_ID
        startupProbe:          # FIXED: Properly nested inside container properties
          httpGet:
            path: /api/health
            port: http
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:        # FIXED: Properly nested inside container properties
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        resources:             # FIXED: Properly nested inside container properties
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:              # FIXED: Un-nested limits from requests
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mortgage-backend
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: mortgage-backend
  ports:
  - port: 3001
    targetPort: 3001
