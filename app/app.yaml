apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: techwmarcus/mtg-frontend:v0.8
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: creds-db
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "window.env = { 
              VITE_COGNITO_USER_POOL_ID: '${VITE_COGNITO_USER_POOL_ID}', 
              VITE_COGNITO_USER_POOL_CLIENT_ID: '${VITE_COGNITO_USER_POOL_CLIENT_ID}',
              VITE_AWS_REGION: '${VITE_AWS_REGION}'
            };" > /usr/share/nginx/html/env-config.js;
            
            echo "Successfully generated runtime env-config.js with AWS/Cognito variables.";
            echo "Starting Nginx web server...";
            nginx -g "daemon off;";
        readinessProbe:        # FIXED: Moved out of ports list array
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        resources:             # FIXED: Moved out of ports list array
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: prod
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 8080
