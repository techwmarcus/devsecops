apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/techwmarcus/devsecops.git'
    targetRevision: main
    path: app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
